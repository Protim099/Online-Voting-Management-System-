<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Candidates | Voting Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">🗳️ VOTING MANAGEMENT SYSTEM</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="elections.html">Elections</a>
      <a href="candidates.html" class="active">Candidates</a>
      <a href="results.html">Results</a>
    </nav>
    <div class="profile">
      <span id="adminName">Admin</span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="elections.html">🗳️ Elections</a>
      <a href="candidates.html" class="active">👤 Candidates</a>
      <a href="results.html">📈 Results</a>
    </div>

    <div class="main">
      <h1>Candidates</h1>

      <div class="card">
        <div class="form-group" style="max-width:360px">
          <label>Select election</label>
          <select id="electionSelect"></select>
        </div>
      </div>

      <div class="card">
        <div class="page-header">
          <h2 style="margin:0">Add candidate</h2>
        </div>
        <form id="candidateForm">
          <div class="form-row">
            <div class="form-group"><label>Name</label><input type="text" id="name" required></div>
            <div class="form-group"><label>Party</label><input type="text" id="party" placeholder="Independent"></div>
          </div>
          <div class="form-group"><label>Position</label><input type="text" id="position" placeholder="e.g. President"></div>
          <button class="btn btn-primary" type="submit">Add Candidate</button>
        </form>
      </div>

      <div class="card">
        <h2>Candidate list</h2>
        <table>
          <thead><tr><th>Name</th><th>Party</th><th>Position</th><th>Votes</th><th>Actions</th></tr></thead>
          <tbody id="candidatesTbody"><tr><td colspan="5" class="empty-state">Select an election above</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/candidates.js"></script>
</body>
</html>
