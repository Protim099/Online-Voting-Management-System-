<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register | Voting Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <h1>Voter Registration</h1>
      <p class="sub">Create your voter account</p>
      <div class="error-msg" id="errorMsg"></div>
      <form id="registerForm">
        <div class="form-group">
          <label>Full name</label>
          <input type="text" id="name" required placeholder="Jane Doe">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <button class="btn btn-primary" style="width:100%" type="submit">Create account</button>
      </form>
      <p style="margin-top:14px;font-size:13px;text-align:center">
        Already registered? <a href="index.html" style="color:#2f5fd6;font-weight:600">Login</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
